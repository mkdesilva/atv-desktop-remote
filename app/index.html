<!DOCTYPE html>
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval';">
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATV Remote</title>
    <link rel="stylesheet" href="css/loaders.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" id="s2style-sheet" href="css/select2-inverted.css">
    <script>
        window.jQuery = window.$ = require('jquery');
        require('./js/select2.min.js')($)
    </script>
    <script src="js/tippy-headless.umd.min.js"></script>
    <script src="js/loader.js"></script>


    <body>
        <header class="bar">
            <div id="atvDropdownContainer"></div>
            <div class="barActions">
                <button id="topTextKBLink" class="iconButton" onclick="openKeyboardClick(event)" title="Open keyboard (K)" aria-label="Open keyboard">
                    <span class="keyText"><i class="fas fa-keyboard"></i></span><span class="keyTextAlt">K</span>
                </button>
                <button id="exitLink" class="iconButton" title="Quit (press Q three times)" aria-label="Quit">
                    <span class="keyText"><i class="fas fa-power-off"></i></span><span class="keyTextAlt">Q&times;3</span>
                </button>
            </div>
        </header>

        <div id="initText">
            <div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
            <p>Starting ATV Remote&hellip;</p>
        </div>

        <main id="main">
            <div id="addNewElements">
                <div id="loader">
                    <div id="pairingLoader"></div>
                </div>
                <div id="pairingElements">
                    <div id="results">
                        <h1 class="pairTitle">Pair an Apple TV</h1>
                        <label for="atv_picker">Choose a device. Credentials are saved, so you only do this once.</label>
                        <select id="atv_picker"></select>
                        <div id="manualIp">
                            <input id="manualIpInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="192.168.1.20" aria-label="Apple TV IP address" />
                            <p class="pairMeta">On the Apple TV: Settings &rarr; Network shows its IP address.</p>
                            <button class="simpleButton primary" id="manualIpButton">Continue</button>
                        </div>
                    </div>
                    <div id="pairCodeElements">
                        <h1 class="pairTitle">Enter the code</h1>
                        <label for="pairCode">Type the 4-digit code shown on your TV.</label>
                        <input id="pairCode" type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="0000" />
                        <p class="pairMeta">Pairing <span id="pairProtocolName">Companion</span> &middot; step <span id="pairStepNum">1</span> of 1</p>
                        <button onclick="javascript:;" class="simpleButton primary" id="pairButton">Pair</button>
                    </div>
                    <button id="cancelPairing" class="simpleButton"><span class="keyText">Cancel</span><span class="keyTextAlt">Cancel</span></button>
                </div>
            </div>

            <div id="runningElements">
                <div class="directionTable">
                    <div class="clickpad">
                        <button data-key="up" class="padZone padUp" aria-label="Up"><span class="keyText"><i class="fas fa-chevron-up"></i></span><span class="keyTextAlt">&uarr;</span></button>
                        <button data-key="left" class="padZone padLeft" aria-label="Left"><span class="keyText"><i class="fas fa-chevron-left"></i></span><span class="keyTextAlt">&larr;</span></button>
                        <button data-key="right" class="padZone padRight" aria-label="Right"><span class="keyText"><i class="fas fa-chevron-right"></i></span><span class="keyTextAlt">&rarr;</span></button>
                        <button data-key="down" class="padZone padDown" aria-label="Down"><span class="keyText"><i class="fas fa-chevron-down"></i></span><span class="keyTextAlt">&darr;</span></button>
                        <button data-key="select" class="padSelect" aria-label="Select"><span class="keyText"></span><span class="keyTextAlt">Enter</span></button>
                    </div>

                    <div class="buttonRow">
                        <button data-key="menu" class="roundKey" aria-label="Back" title="Back"><span class="keyText"><i class="fas fa-chevron-left"></i></span><span class="keyTextAlt">Esc</span></button>
                        <button data-key="home" class="roundKey" aria-label="TV" title="TV (hold for Control Center)"><span class="keyText"><i class="fas fa-tv"></i></span><span class="keyTextAlt">T</span></button>
                        <div class="pill" role="group" aria-label="Volume">
                            <button data-key="volume_down" aria-label="Lower volume" title="Lower volume"><span class="keyText"><i class="fas fa-minus"></i></span><span class="keyTextAlt">&minus;</span></button>
                            <button data-key="volume_up" aria-label="Raise volume" title="Raise volume"><span class="keyText"><i class="fas fa-plus"></i></span><span class="keyTextAlt">+</span></button>
                        </div>
                    </div>

                    <div class="pill transport" role="group" aria-label="Playback">
                        <button data-key="skip_backward" aria-label="Previous" title="Previous"><span class="keyText"><i class="fas fa-step-backward"></i></span><span class="keyTextAlt">[</span></button>
                        <button data-key="play_pause" aria-label="Play or pause" title="Play / Pause"><span class="keyText"><i class="fas fa-play"></i><i class="fas fa-pause"></i></span><span class="keyTextAlt">Space</span></button>
                        <button data-key="skip_forward" aria-label="Next" title="Next"><span class="keyText"><i class="fas fa-step-forward"></i></span><span class="keyTextAlt">]</span></button>
                    </div>
                </div>
            </div>

            <div id="cmdWrapper">
                <div id="cmdFade"></div>
            </div>
        </main>

        <footer>
            <p id="statusText"></p>
            <p class="hint keyTextAlt">H hide &middot; K keyboard &middot; Shift+key long press</p>
        </footer>
    </body>
    <script src="web_remote.js"></script>

</html>
